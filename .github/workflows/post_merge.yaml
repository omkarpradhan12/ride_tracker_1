name: Release APK on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Tag from PR Description
        id: get_tag
        run: |
          # Look for 'tr#' followed by digits and dots in the PR body
          # Example: tr#2.0.0 -> 2.0.0
          TAG=$(echo "${{ github.event.pull_request.body }}" | grep -oP 'tr#\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          if [ -z "$TAG" ]; then
            echo "No tag found in PR body (format tr#x.x.x). Using fallback."
            TAG="v${{ github.run_number }}-no-tag"
          fi
          
          echo "final_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.final_tag }}
          name: Release ${{ steps.get_tag.outputs.final_tag }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
